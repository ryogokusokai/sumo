<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>土俵データ帳</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1d1b18;--sub:#6b665d;--line:#e4dfd4;--accent:#9b2c1f;--win:#1f6f43;--loss:#9b2c1f;--chip:#efeae0}
@media (prefers-color-scheme:dark){:root{--bg:#141311;--card:#1d1c19;--ink:#ece8df;--sub:#9d978b;--line:#2f2d28;--accent:#e0705f;--win:#5cc28a;--loss:#e0705f;--chip:#28261f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:14px;line-height:1.5}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.hwrap{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;color:var(--accent);text-decoration:none;letter-spacing:.05em}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;padding:5px 10px;border-radius:6px;font-size:14px}
nav a.on{background:var(--accent);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:16px;margin:22px 0 8px;padding-left:8px;border-left:4px solid var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{font-size:12px;color:var(--sub);font-weight:600;background:var(--chip);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
td.c,th.c{text-align:center}td.r,th.r{text-align:right}
a.rk{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--sub)}
.w{color:var(--win);font-weight:700}.l{color:var(--loss);font-weight:700}
.muted{color:var(--sub);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--chip);color:var(--sub);margin-left:4px}
.tag.hot{background:var(--accent);color:#fff}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input,select{font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kv{background:var(--chip);border-radius:8px;padding:8px 10px}.kv b{display:block;font-size:17px}.kv span{font-size:12px;color:var(--sub)}
.bar{height:8px;background:var(--accent);border-radius:4px}
.loading{padding:30px;text-align:center;color:var(--sub)}
.err{padding:14px;color:var(--loss)}
.race li{margin:3px 0}
.bout td.mid{color:var(--sub);font-size:12px;text-align:center}
svg text{fill:var(--sub);font-size:10px}
footer{max-width:1100px;margin:20px auto;padding:0 14px 30px;color:var(--sub);font-size:12px}
footer a{color:var(--sub)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.ichip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink)}
.ichip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ichsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:12px}
.ichsum .kv{border-left:5px solid var(--c)}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:9px;padding-left:16px;border-left:1px solid var(--line)}
.tree li{position:relative;padding:3px 0}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:14px;width:12px;border-top:1px solid var(--line)}
.node{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:2px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c)}
.node.def{opacity:.55;border-style:dashed;border-left-style:solid}
.node a{color:var(--ink);font-weight:700;text-decoration:none}
.node .sub{font-size:11px;color:var(--sub)}
.node.dim{opacity:.25}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kim=k=>k?(KIM[k.trim().toLowerCase()]||k):"";
const heya=h=>HEYA[h]||h||"";
const pref=s=>{if(!s)return"";const p=s.split(",")[0].trim().replace(/-(ken|to|fu)$/,"");return PREF[p]||p};
function cleanJp(s,en){if(!s||/[<>]/.test(s))return en||"";return s.split(/[\s　(（]/)[0]||en||""}
function parseRank(r){if(!r)return null;const m=r.match(/^(\w+)\s*(\d+)?\s*(East|West)?/);if(!m||!RANK[m[1]])return{full:r,short:r,val:99999,div:""};const [full,sh,ord]=RANK[m[1]];const n=+(m[2]||1);const side=m[3]==="West"?"西":m[3]==="East"?"東":"";const sanyaku=ord<=4;return{full:(side)+full+(sanyaku?"":n+"枚目"),short:sanyaku?full:sh+n,side,val:ord*1000+n*2+(m[3]==="West"?1:0),ord,num:n}}
function bashoName(id){id=String(id);return id.slice(0,4)+"年"+(BASHO_NAME[id.slice(4,6)]||id.slice(4,6)+"月")}
function age(d){if(!d)return"";const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a}
const ymd=d=>d?d.slice(0,10):"";
const ym=s=>s?s.slice(0,4)+"-"+s.slice(4,6):"";

/* cache (localStorage, TTL) */
const mem=new Map();
async function api(path,ttl=300){
  const key="sumo:"+path;
  if(mem.has(key)){const m=mem.get(key);if(Date.now()-m.t<ttl*1000)return m.v}
  try{const c=JSON.parse(localStorage.getItem(key)||"null");if(c&&Date.now()-c.t<ttl*1000){mem.set(key,c);return c.v}}catch(e){}
  let lastErr;
  for(let i=0;i<3;i++){
    try{const r=await fetch(API+path);if(!r.ok)throw new Error("HTTP "+r.status);const v=await r.json();const e={t:Date.now(),v};mem.set(key,e);try{localStorage.setItem(key,JSON.stringify(e))}catch(_){try{for(const k of Object.keys(localStorage))if(k.startsWith("sumo:"))localStorage.removeItem(k)}catch(__){}}return v}
    catch(e){lastErr=e;await new Promise(r=>setTimeout(r,600*(i+1)))}
  }
  throw lastErr;
}
async function pool(items,fn,c=6){const out=new Array(items.length);let i=0;await Promise.all([...Array(Math.min(c,items.length))].map(async()=>{while(i<items.length){const k=i++;try{out[k]=await fn(items[k])}catch(e){out[k]=null}}}));return out}

/* current basho */
function bashoCandidates(n=24){const d=new Date(Date.now()+9*3600e3);let y=d.getUTCFullYear(),m=d.getUTCMonth()+1;if(m%2===0)m--;const out=[];for(let i=0;i<n;i++){out.push(y+String(m).padStart(2,"0"));m-=2;if(m<1){m+=12;y--}}return out}
let CUR=null;
async function currentBasho(){if(CUR)return CUR;for(const b of bashoCandidates(3)){try{const z=await api(`/basho/${b}/banzuke/Makuuchi`,600);if(z&&z.east&&z.east.length){CUR=b;return b}}catch(e){}}CUR=bashoCandidates(2)[1];return CUR}
function bashoTTL(b){return b===CUR?300:86400}

/* record helpers */
function recOf(rec,sekitori){let w=0,l=0,a=0;for(const r of rec||[]){const s=r.result||"";if(s==="win"||s==="fusen win")w++;else if(s==="loss"||s==="fusen loss")l++;else if(s==="absent"&&sekitori)a++}return{w,l,a,txt:w+"-"+l+(a?"-"+a:"")}}
const recHtml=o=>`<span class="${o.w>o.l?"w":o.l>o.w?"l":""}">${o.txt}</span>`;
function dayFromRecord(rec){let d=0;rec.forEach((r,i)=>{if(/^(fusen )?(win|loss)$/.test(r.result||""))d=i+1});return d}

/* name map for current basho (id -> jp shikona) */
const NAMES={};
function addNames(list){for(const r of list||[]){const id=r.rikishiID??r.id;if(id!=null&&!NAMES[id])NAMES[id]=cleanJp(r.shikonaJp,r.shikonaEn)}}
async function loadAllRikishi(){const z=await api("/rikishis?intai=false&limit=1000",3600);addNames(z.records);return z.records}
const nm=(id,en)=>NAMES[id]||en||"?";
const link=(id,en)=>`<a class="rk" href="#r-${id}">${esc(nm(id,en))}</a>`;

/* ---------- router ---------- */
const app=$("#app");
function setNav(k){document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===k))}
let token=0;
async function route(){
  const h=decodeURIComponent(location.hash.slice(1))||"banzuke";const my=++token;
  app.innerHTML='<div class="loading">読み込み中…</div>';window.scrollTo(0,0);
  try{
    let m;
    if((m=h.match(/^r-(\d+)$/))){setNav("rikishi");await viewRikishi(+m[1],my)}
    else if(h.startsWith("rikishi")){setNav("rikishi");await viewList(my)}
    else if((m=h.match(/^heya-(\w+)$/))){setNav("heya");await viewHeyaDetail(m[1],my)}
    else if(h.startsWith("heya")){setNav("heya");await viewHeya(my)}
    else if((m=h.match(/^day(?:-(\d{6}))?(?:-(\d+))?(?:-(\w+))?$/))){setNav("day");await viewDay(m[1],m[2],m[3],my)}
    else{m=h.match(/^banzuke(?:-(\d{6}))?(?:-(\w+))?$/)||[];setNav("banzuke");await viewBanzuke(m[1],m[2],my)}
  }catch(e){if(my===token)app.innerHTML=`<div class="err">データを取得できませんでした（${esc(e.message)}）。少し時間をおいて再読み込みしてください。</div>`}
}
window.addEventListener("hashchange",route);
const live=my=>my===token;

/* ---------- 番付 ---------- */
async function viewBanzuke(basho,div,my){
  const cur=await currentBasho();basho=basho||cur;div=DIVJP[div]?div:"Makuuchi";
  const opts=bashoCandidates(36).filter(b=>b<=cur).map(b=>`<option value="${b}"${b===basho?" selected":""}>${bashoName(b)}</option>`).join("");
  const z=await api(`/basho/${basho}/banzuke/${div}`,bashoTTL(basho));if(!live(my))return;
  const E=z.east||[],W=z.west||[];addNames(E);addNames(W);
  const sek=div==="Makuuchi"||div==="Juryo";
  const rows=new Map();
  for(const r of [...E,...W]){const p=parseRank(r.rank);const k=(p.ord<=4&&div==="Makuuchi")?p.ord*100+p.num:1000+p.num;if(!rows.has(k))rows.set(k,{k,label:"",E:null,W:null});const row=rows.get(k);row.label=p.ord<=4?RANK[r.rank.split(" ")[0]][0]+(p.num>1?p.num:""):RANK[r.rank.split(" ")[0]][1]+p.num;row[r.side==="West"?"W":"E"]=r}
  const sorted=[...rows.values()].sort((a,b)=>a.k-b.k);
  let day=0;for(const r of E)day=Math.max(day,dayFromRecord(r.record||[]));
  app.innerHTML=`<h1>${bashoName(basho)} 番付</h1>
  <div class="ctrl"><select id="bsel">${opts}</select><span class="muted">${day?day+"日目まで反映":"場所前"}</span></div>
  <div class="tabs">${DIVS.map(([k,j])=>`<button data-d="${k}" class="${k===div?"on":""}">${j}</button>`).join("")}</div>
  <div class="card scroll"><table><thead><tr><th class="c">成績</th><th class="r">東</th><th class="c">番付</th><th>西</th><th class="c">成績</th></tr></thead><tbody id="btb">
  ${sorted.map(row=>{const cell=(r,side)=>{if(!r)return side==="E"?'<td></td><td></td>':'<td></td><td></td>';const rc=recOf(r.record,sek);const nmh=`<span class="hd" data-id="${r.rikishiID}"></span>${link(r.rikishiID,r.shikonaEn)}<span class="tg" data-id="${r.rikishiID}"></span>`;return side==="E"?`<td class="c">${recHtml(rc)}</td><td class="r">${nmh}</td>`:`<td>${nmh}</td><td class="c">${recHtml(rc)}</td>`};return`<tr>${cell(row.E,"E")}<td class="c muted">${row.label}</td>${cell(row.W,"W")}</tr>`}).join("")}
  </tbody></table></div>
  <p class="muted">${ICHIMON.map(i=>ichDot(i.k)+i.k).join("　")}（色は現在の所属部屋の一門）<br>${sek?"成績は 勝-敗-休。":"成績は 勝-敗。"}${sek?"印（新入幕・再入幕・新十両・再十両・自己最高位・休場）は番付履歴から算出。":""}</p>`;
  $("#bsel").onchange=e=>location.hash=`banzuke-${e.target.value}-${div}`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>location.hash=`banzuke-${basho}-${b.dataset.d}`);
  loadAllRikishi().then(list=>{if(!live(my))return;const hm=Object.fromEntries(list.map(r=>[r.id,r.heya]));document.querySelectorAll(".hd").forEach(e=>e.innerHTML=ichDot(ichOf(hm[e.dataset.id])))}).catch(()=>{});
  if(sek){
    const all=[...E,...W];
    const tag=(id,html)=>{const el=document.querySelector(`.tg[data-id="${id}"]`);if(el)el.innerHTML+=html};
    for(const r of all)if((r.record||[]).some(x=>x.result==="absent"))tag(r.rikishiID,'<span class="tag">休場</span>');
    await pool(all,async r=>{const d=await api(`/rikishi/${r.rikishiID}?ranks=true`,86400);if(!live(my))return;const hist=(d.rankHistory||[]).filter(x=>x.bashoId<basho);const curv=parseRank(r.rank);const prevVals=hist.map(x=>parseRank(x.rank));
      const inDiv=v=>div==="Makuuchi"?v.ord<=5:v.ord===6;
      const last=hist.sort((a,b)=>b.bashoId.localeCompare(a.bashoId))[0];
      const prevIn=last&&inDiv(parseRank(last.rank));const ever=prevVals.some(inDiv);
      if(!prevIn){if(!ever)tag(r.rikishiID,`<span class="tag hot">${div==="Makuuchi"?"新入幕":"新十両"}</span>`);else tag(r.rikishiID,`<span class="tag">${div==="Makuuchi"?"再入幕":"再十両"}</span>`)}
      if(prevVals.length&&curv.val<Math.min(...prevVals.map(v=>v.val))&&prevIn)tag(r.rikishiID,'<span class="tag hot">自己最高位</span>');
    },6);
  }
}

async function viewDay(basho,day,div,my){
  const cur=await currentBasho();basho=basho||cur;div=DIVJP[div]?div:"Makuuchi";

function chainOf(id){const out=[];let h=HMAP[id],g=0;while(h&&g++<20){out.unshift(h);h=h.p?HMAP[h.p]:null}return out}
function heyaCounts(list){const c={};for(const r of list){const k=r.heya;const o=c[k]||(c[k]={n:0,seki:0});o.n++;const p=parseRank(r.currentRank);if(p&&p.ord&&p.ord<=6)o.seki++}return c}

  const node=h=>{const def=h.st==="def";const c=cnt[h.en]||{n:0,seki:0};const moved=h.p&&HMAP[h.p]&&HMAP[h.p].ich!==h.ich&&!def;

    return`<li><span class="node${def?" def":""}${dim}" style="--c:${ICOL[h.ich]||"#999"}">${def?`<b>${esc(h.id.replace("(旧)","（旧）"))}</b>`:`<a href="#heya-${h.en}">${esc(h.id)}</a>`}${h.sou?'<span class="tag hot">一門の本家</span>':""}<span class="sub">${h.y?esc(h.y)+"年":""}${def&&h.close?"〜"+esc(h.close)+"年閉鎖":""}${founderOf(h)?" "+esc(founderOf(h))+"が創設":""}</span>${!def?`<span class="sub">力士${c.n}人${c.seki?"・関取"+c.seki:""}</span>`:""}${moved?`<span class="tag">→${esc(h.ich)}一門</span>`:""}${h.pt?`<span class="sub">（${esc(h.pt)}）</span>`:""}</span>${(kids[h.id]||[]).length?`<ul>${kids[h.id].map(node).join("")}</ul>`:""}</li>`};

  app.innerHTML=`<h1>部屋の系譜と一門</h1>

  ${bashoRows.map(b=>{const x=byB[b]||{w:0,l:0};const p=rankOf[b];return`<tr><td>${bashoName(b)}</td><td>${p?esc(p.full):""}</td><td class="c"><span class="${x.w>x.l?"w":x.l>x.w?"l":""}">${x.w}-${x.l}</span></td></tr>`}).join("")}
  </tbody></table></div>
  <p class="muted">場所別成績は取組データからの集計（不戦勝・不戦敗を含み、休場は含まない）。</p>
  <h2>決まり手</h2><div class="card scroll" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">
   <div><b>勝ち</b><table>${kTable(kw,"w")}</table></div><div><b>負け</b><table>${kTable(kl,"l")}</table></div></div>
  <h2>対戦成績</h2>
  <div class="ctrl"><input id="hq" placeholder="相手の四股名で絞り込み" style="flex:1;min-width:160px"></div>
  <div class="card scroll" style="max-height:520px;overflow:auto"><table><thead><tr><th>相手</th><th class="c">勝</th><th class="c">敗</th><th>最新の対戦</th></tr></thead><tbody id="h2h"></tbody></table></div>`;
  const drawH=q=>{q=(q||"").trim().toLowerCase();$("#h2h").innerHTML=h2hRows.filter(o=>!q||nm(o.id,o.en).includes(q)||(o.en||"").toLowerCase().includes(q)).slice(0,300).map(o=>`<tr><td>${link(o.id,o.en)}</td><td class="c w">${o.w}</td><td class="c l">${o.l}</td><td class="muted">${bashoName(o.last.b)}${o.last.d}日目 ${o.last.win?"○":"●"} ${esc(o.last.k)}</td></tr>`).join("")};
  $("#hq").oninput=e=>drawH(e.target.value);drawH("");
}
function rankChart(pr){
  if(pr.length<2)return'<div class="muted">データ不足</div>';
  /* y: 番付を連続値に（各階級の帯を固定幅で配置） */
  const band={1:0,2:1,3:2,4:3,5:4,6:7,7:9,8:12,9:15,10:18};const span={5:3,6:2,7:3,8:3,9:3,10:2};const maxN={5:17,6:14,7:60,8:100,9:110,10:30};
  const y=p=>{const b=band[p.ord];if(p.ord<=4)return b+(p.val%2)*0.3;return b+Math.min(1,(p.num-1)/maxN[p.ord])*span[p.ord]};
  const W=Math.max(600,pr.length*14),H=260,pl=48,pt=10,pb=24,ys=v=>pt+v/20*(H-pt-pb),xs=i=>pl+i*(W-pl-10)/(pr.length-1);
  const labels=[[0,"横綱"],[1,"大関"],[2,"関脇"],[3,"小結"],[4,"前頭"],[7,"十両"],[9,"幕下"],[12,"三段目"],[15,"序二段"],[18,"序ノ口"]];
  const minY=Math.min(...pr.map(x=>y(x.p))),maxY=Math.max(...pr.map(x=>y(x.p)));
  const pts=pr.map((x,i)=>`${xs(i).toFixed(1)},${ys(y(x.p)).toFixed(1)}`).join(" ");
  const years=pr.map((x,i)=>x.b.endsWith("01")?`<text x="${xs(i)}" y="${H-6}" text-anchor="middle">${x.b.slice(0,4)}</text><line x1="${xs(i)}" x2="${xs(i)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)"/>`:"").join("");
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  ${labels.map(([v,t])=>`<line x1="${pl}" x2="${W-10}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" ${v===7?'stroke-width="2"':""}/><text x="4" y="${ys(v)+3}">${t}</text>`).join("")}
  ${years}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
  ${pr.map((x,i)=>`<circle cx="${xs(i)}" cy="${ys(y(x.p))}" r="2.5" fill="var(--accent)"><title>${bashoName(x.b)} ${x.p.full}</title></circle>`).join("")}
  </svg>`;
}
route();
</script>
